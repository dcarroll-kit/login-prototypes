<title>MLS to LAFC Login</title>
<style>
/* Layout: one phone stage centred, controls underneath. Stage colours are fixed to the screens' own palette. */
:root {
  --stage: #f1eee8; --ink: #1d1a15; --muted: #6d6556; --line: #d9d2c4; --gold: #b7985d; --ctrl: #ffffff;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --stage: #14120f; --ink: #efe9dd; --muted: #a09682; --line: #2f2a22; --ctrl: #1e1b16; color-scheme: dark } }
:root[data-theme="dark"] { --stage: #14120f; --ink: #efe9dd; --muted: #a09682; --line: #2f2a22; --ctrl: #1e1b16; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--stage); color: var(--ink); font-family: var(--font-ui); padding-inline: 16px; padding-block: 20px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 16px; }

.phone-wrap { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; justify-content: center; align-items: center; }
.phone { position: relative; width: 392px; height: 856px; transform-origin: center center; border-radius: 44px; overflow: hidden; box-shadow: 0 0 0 10px #0b0a08, 0 30px 60px rgba(0,0,0,.35); flex: none; }
.bg { position: absolute; inset: 0; }
.sweep { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; }
.glint { position: absolute; left: 0; right: 0; top: 0; height: 420px; pointer-events: none; opacity: 0;
  background: radial-gradient(circle at 50% 46%, rgba(255,236,190,.55), rgba(255,236,190,0) 55%); }

.logo { position: absolute; left: 0; top: 0; width: 0; height: 0; perspective: 700px; }
.logo .spin { position: absolute; transform-style: preserve-3d; }
.logo svg { display: block; width: 100%; height: 100%; }
.wordmark { position: absolute; left: 97px; top: 194.2px; width: 189px; height: 55.2px; }

.form { position: absolute; left: 24px; top: 306px; width: 345px; color: #fff; }
.label { font-size: 13px; line-height: 18px; height: 18px; }
.field { margin-top: 6px; height: 46px; box-sizing: border-box; border: 3px solid #fff; border-radius: 8px; }
.pw { margin-top: 21px; }
.btn { margin-top: 35px; height: 48px; border-radius: 8px; background: #fff; color: #3b4960; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.forgot { margin-top: 35px; text-align: center; font-weight: 700; font-size: 14px; }

.powered { position: absolute; left: 128px; top: 746px; width: 126px; color: #fff; text-align: center; }
.powered span { display: block; font-size: 14px; line-height: 20px; letter-spacing: .01em; }
.powered svg { display: block; width: 126px; height: 15px; margin-top: 12px; }

.controls { flex: none; width: min(420px, 100%); display: flex; align-items: center; gap: 12px; }
.controls button { flex: none; font: 600 13px var(--font-ui); color: var(--ink); background: var(--ctrl); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.controls button:focus-visible, .controls input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.controls input[type=range] { flex: 1 1 auto; min-width: 0; accent-color: var(--gold); }
.time { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; width: 3.2em; text-align: right; }
</style>

<div class="controls">
  <button id="play" type="button">Pause</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Animation timeline">
  <span class="time" id="time">0.0s</span>
  <button id="replay" type="button">Replay</button>
</div>

<script>
(() => {
  const DUR = 3.2;                 // full loop, seconds
  const SPIN = [0.8, 2.0];         // logo spin window
  const SWIPE = [0.6, 2.4];      // diagonal colour swipe window
  const BOUNCE = [1.8, 2.6];       // landing bounce
  const TURNS = 3;                 // full rotations

  const $ = id => document.getElementById(id);
  const bg = $('bg'), bg2 = $('bg2'), sweep = $('sweep'), spin = $('spin'), mls = $('mls'), lafc = $('lafc'),
        word = $('wordmark'), glint = $('glint'), scrub = $('scrub'), time = $('time'), playBtn = $('play');

  // Background gradients sampled from the two Figma frames
  const grad = (top, bot, hold) => `linear-gradient(180deg, rgb(${top}) 0%, rgb(${top}) ${hold}%, rgb(${bot}) 100%)`;
  bg.style.background  = grad('0,0,0', '94,79,48', 25);       // black → dark gold
  bg2.style.background = grad('183,152,93', '72,60,37', 35);  // gold → deep bronze

  // Logo geometry (px, phone coordinates): MLS shield vs LAFC crest
  const A = { cx: 191.7, cy: 139.0, w: 86.7, h: 92.8 };
  const B = { cx: 194.5, cy: 189.0, w: 101,  h: 138.0 };

  const clamp = v => Math.min(1, Math.max(0, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const seg = (t, [a, b]) => clamp((t - a) / (b - a));
  const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const bounceOut = t => {
    const n = 7.5625, d = 2.75;
    if (t < 1/d) return n*t*t;
    if (t < 2/d) return n*(t -= 1.5/d)*t + .75;
    if (t < 2.5/d) return n*(t -= 2.25/d)*t + .9375;
    return n*(t -= 2.625/d)*t + .984375;
  };

  function render(t) {
    // Colour swipe: new gradient fades up the screen from bottom to top with a bright leading edge
    const w = ease(seg(t, SWIPE));
    const p = lerp(-35, 135, w);              // edge position, % along the diagonal
    const m = `linear-gradient(0deg, #000 ${p - 30}%, transparent ${p + 30}%)`;
    bg2.style.webkitMaskImage = bg2.style.maskImage = m;
    const edge = Math.sin(Math.PI * w) * w;   // softer near the bottom, stronger as it rises
    sweep.style.opacity = edge;
    sweep.style.background = `linear-gradient(0deg, transparent ${p - 30}%, rgba(214,178,108,.4) ${p}%, transparent ${p + 25}%)`;

    // Spin
    const s = ease(seg(t, SPIN));
    const angle = s * TURNS * 360;
    const swapAt = (TURNS - 0.75) * 360;
    const showLafc = angle >= swapAt;
    mls.style.display = showLafc ? 'none' : 'block';
    lafc.style.display = showLafc ? 'block' : 'none';

    // Size/position: shield grows into crest across the second half of the spin
    const g = ease(clamp((s - 0.35) / 0.65));
    const lw = lerp(A.w, B.w, g), lh = lerp(A.h, B.h, g);
    const cx = lerp(A.cx, B.cx, g), cy = lerp(A.cy, B.cy, g);
    const facingBack = Math.cos(angle * Math.PI / 180) < 0;

    // Bounce: lifts while spinning, then drops and bounces into place with a squash on each contact
    // Smooth jump: eases up, then settles with a soft damped spring (one gentle rebound)
    const rise = ease(seg(t, [SPIN[0], SPIN[0] + 0.5]));
    const kf = Math.max(0, t - (SPIN[1] - 0.3));
    const settle = Math.exp(-4.2 * kf) * Math.cos(7.5 * kf);
    const lift = -26 * rise * settle;
    const k = t - BOUNCE[0];
    const squash = k > 0 ? 0.05 * Math.exp(-4 * k) * Math.sin(k * 11) : 0;
    const pop = 1 + 0.12 * Math.sin(Math.PI * s);

    spin.style.width = lw + 'px'; spin.style.height = lh + 'px';
    spin.style.left = (cx - lw/2) + 'px'; spin.style.top = (cy - lh/2) + 'px';
    spin.style.transformOrigin = '50% 100%';
    spin.style.transform = `translateY(${lift}px) rotateY(${angle}deg) scale(${pop * (1 + squash)}, ${pop * (1 - squash)})${facingBack ? ' scaleX(-1)' : ''}`;

    // Glint flash around the swap moment
    const swapT = SPIN[0] + (SPIN[1] - SPIN[0]) * 0.80;
    glint.style.opacity = Math.max(0, 1 - Math.abs(t - swapT) / 0.3) * 0.9;

    // Wordmark fade
    const f = easeOut(seg(t, [0.6, 0.85]));
    word.style.opacity = 1 - f;
    word.style.transform = `translateY(${f * 10}px)`;

    scrub.value = Math.round(t / DUR * 1000);
    time.textContent = t.toFixed(1) + 's';
  }

  // Playback
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playing = !reduce, t = reduce ? DUR : 0, last = null;
  playBtn.textContent = playing ? 'Pause' : 'Play';
  function frame(now) {
    if (playing) {
      if (last != null) { t += (now - last) / 1000; if (t > DUR + 1.0) t = 0; }
      last = now;
    } else last = null;
    render(Math.min(t, DUR));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  playBtn.addEventListener('click', () => { playing = !playing; if (playing && t >= DUR) t = 0; playBtn.textContent = playing ? 'Pause' : 'Play'; });
  $('replay').addEventListener('click', () => { t = 0; playing = true; playBtn.textContent = 'Pause'; });
  scrub.addEventListener('input', () => { playing = false; playBtn.textContent = 'Play'; t = scrub.value / 1000 * DUR; });

  // Fit phone to available space
  const wrap = $('wrap'), phone = $('phone');
  function fit() {
    const r = wrap.getBoundingClientRect();
    const k = Math.min(1, (r.width - 24) / 392, (r.height - 24) / 856);
    phone.style.transform = `scale(${Math.max(0.3, k)})`;
    phone.style.margin = `${-(856 * (1 - k)) / 2}px ${-(392 * (1 - k)) / 2}px`;
  }
  addEventListener('resize', fit); fit();
})();
</script>
